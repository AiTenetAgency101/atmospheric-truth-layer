<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyclical Truth — 24h Timepiece</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #00ffcc;
      font-family: 'Courier New', monospace;
      overflow: auto;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 1600px;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .title {
      font-size: 42px;
      color: #00ffff;
      text-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
      letter-spacing: 4px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 12px;
      color: #888;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* ANALOG CLOCK FACE */
    .clockface {
      width: 400px;
      height: 400px;
      margin: 40px auto;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(0, 255, 255, 0.1), rgba(0, 255, 204, 0.05));
      border: 3px solid #00ffcc;
      position: relative;
      box-shadow: 0 0 40px rgba(0, 255, 255, 0.3);
    }

    .clock-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      background: #00ff00;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(0, 255, 0, 0.8);
    }

    .hour-hand {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 80px;
      background: #00ffff;
      transform-origin: center bottom;
      margin-left: -3px;
      margin-top: -80px;
    }

    .minute-hand {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 120px;
      background: #00ff99;
      transform-origin: center bottom;
      margin-left: -2px;
      margin-top: -120px;
    }

    .second-hand {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 2px;
      height: 130px;
      background: #ff00ff;
      transform-origin: center bottom;
      margin-left: -1px;
      margin-top: -130px;
    }

    .hour-mark {
      position: absolute;
      width: 2px;
      height: 20px;
      background: #00ffcc;
      left: 50%;
      top: 10px;
      margin-left: -1px;
      transform-origin: center 190px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin: 40px 0;
    }

    .stat-card {
      background: rgba(0, 255, 204, 0.05);
      border: 1px solid #00ffcc;
      padding: 20px;
      border-radius: 4px;
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .stat-value {
      font-size: 28px;
      color: #00ffff;
      font-weight: bold;
      font-family: 'Courier New', monospace;
    }

    .stat-unit {
      font-size: 12px;
      color: #00ffcc;
      margin-left: 5px;
    }

    .section {
      background: rgba(0, 255, 204, 0.03);
      border: 1px solid #00ffcc;
      padding: 20px;
      margin: 20px 0;
      border-radius: 4px;
    }

    .section-title {
      font-size: 12px;
      color: #00ffff;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #00ffcc;
    }

    .symbols-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .symbol {
      background: rgba(0, 255, 255, 0.05);
      border: 1px solid #00ffcc;
      padding: 12px;
      border-radius: 3px;
    }

    .symbol-key {
      font-size: 10px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .symbol-value {
      font-size: 18px;
      color: #00ffff;
      font-weight: bold;
    }

    .witness-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .witness {
      background: rgba(0, 255, 255, 0.05);
      border: 1px solid #00ffcc;
      padding: 10px;
      border-radius: 3px;
      text-align: center;
    }

    .witness-name {
      font-size: 12px;
      color: #00ffcc;
      font-weight: bold;
    }

    .witness-align {
      font-size: 11px;
      color: #888;
      margin-top: 5px;
    }

    .loading {
      text-align: center;
      color: #00ffcc;
      font-size: 18px;
      padding: 60px;
    }

    @media (max-width: 1200px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .clockface {
        width: 300px;
        height: 300px;
      }
    }

    @media (max-width: 600px) {
      .title {
        font-size: 28px;
      }
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">⏱️ CYCLICAL TRUTH STREAM</div>
      <div class="subtitle">24-Hour Timepiece · 86,400 Second Cycle · 1,296,000 Arc Resolution</div>
    </div>

    <div id="content" class="loading">
      🔄 Initializing cyclical derivation...
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    const POLL_MS = 1000; // Update every second for smooth clock

    async function fetchAndRender() {
      try {
        const res = await fetch(API_BASE + '/stream/truth');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const truth = await res.json();

        if (!truth.cycle) {
          document.getElementById('content').innerHTML = '<div class="loading">⏳ Awaiting cycle derivation...</div>';
          return;
        }

        const cycle = truth.cycle;
        const diurnal = truth.temporal?.diurnal_cycles || {};
        const geographic = truth.spatial?.geographic_tiling || {};
        const witness = truth.witnesses || {};
        const consensus = truth.consensus || {};

        // Convert cycle phase to clock angles
        const totalSeconds = cycle.seconds_in_cycle || 0;
        const hourAngle = ((totalSeconds / 3600) % 12) * 30; // 30° per hour
        const minuteAngle = ((totalSeconds / 60) % 60) * 6; // 6° per minute
        const secondAngle = (totalSeconds % 60) * 6; // 6° per second

        let witnessHTML = (witness.witnesses || []).map(w => `
          <div class="witness">
            <div class="witness-name">🛰️ ${w.name}</div>
            <div class="witness-align">Align: ${(w.alignment * 100).toFixed(0)}%</div>
          </div>
        `).join('');

        // Generate hour marks on clock
        let hourMarksHTML = '';
        for (let i = 0; i < 24; i++) {
          const angle = (i / 24) * 360;
          hourMarksHTML += `<div class="hour-mark" style="transform: rotate(${angle}deg);"></div>`;
        }

        document.getElementById('content').innerHTML = `
          <!-- 24-HOUR ANALOG CLOCK -->
          <div class="clockface">
            ${hourMarksHTML}
            <div class="hour-hand" style="transform: rotate(${hourAngle}deg);"></div>
            <div class="minute-hand" style="transform: rotate(${minuteAngle}deg);"></div>
            <div class="second-hand" style="transform: rotate(${secondAngle}deg);"></div>
            <div class="clock-center"></div>
          </div>

          <!-- CYCLE STATISTICS -->
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-label">Cycle Phase</div>
              <div class="stat-value">${(cycle.phase * 100).toFixed(2)}<span class="stat-unit">%</span></div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Phase Angle</div>
              <div class="stat-value">${cycle.phase_deg.toFixed(1)}<span class="stat-unit">°</span></div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Time in Cycle</div>
              <div class="stat-value">${Math.floor(cycle.seconds_in_cycle / 3600)}:${String(Math.floor((cycle.seconds_in_cycle % 3600) / 60)).padStart(2, '0')}</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">K-Value</div>
              <div class="stat-value" style="color: #00ff00;">${consensus.k_value}</div>
            </div>
          </div>

          <!-- TEMPORAL LANE -->
          <div class="section">
            <div class="section-title">⏳ Temporal Lane: Diurnal Cycles</div>
            <div class="symbols-grid">
              <div class="symbol">
                <div class="symbol-key">Diurnal Magnitude</div>
                <div class="symbol-value">${(diurnal.diurnal_magnitude * 100).toFixed(1)}%</div>
              </div>
              <div class="symbol">
                <div class="symbol-key">Semicircadian Mag.</div>
                <div class="symbol-value">${(diurnal.semicircadian_magnitude * 100).toFixed(1)}%</div>
              </div>
              <div class="symbol">
                <div class="symbol-key">Cycle Frequency</div>
                <div class="symbol-value">${diurnal.cycle_frequency_hz.toExponential(2)}<span class="stat-unit">Hz</span></div>
              </div>
              <div class="symbol">
                <div class="symbol-key">Phase Position</div>
                <div class="symbol-value">${diurnal.phase_position_deg.toFixed(1)}°</div>
              </div>
            </div>
          </div>

          <!-- SPATIAL LANE -->
          <div class="section">
            <div class="section-title">🗺️ Spatial Lane: Geographic Tiling</div>
            <div class="symbols-grid">
              <div class="symbol">
                <div class="symbol-key">Arc Position</div>
                <div class="symbol-value">${geographic.arc_position}<span class="stat-unit">″</span></div>
              </div>
              <div class="symbol">
                <div class="symbol-key">Arc Degrees</div>
                <div class="symbol-value">${geographic.arc_position_deg.toFixed(2)}°</div>
              </div>
              <div class="symbol">
                <div class="symbol-key">Arc Coverage</div>
                <div class="symbol-value">${geographic.arc_percentage.toFixed(2)}%</div>
              </div>
              <div class="symbol">
                <div class="symbol-key">Tiles Witnessed</div>
                <div class="symbol-value">${geographic.tiles_witnessed.toLocaleString()}</div>
              </div>
              <div class="symbol">
                <div class="symbol-key">Tiles Validated</div>
                <div class="symbol-value">${geographic.tiles_validated.toLocaleString()}</div>
              </div>
              <div class="symbol">
                <div class="symbol-key">Coverage Ratio</div>
                <div class="symbol-value">${(geographic.tile_coverage_ratio * 100).toFixed(2)}%</div>
              </div>
            </div>
          </div>

          <!-- WITNESS LANE -->
          <div class="section">
            <div class="section-title">🛰️ Witness Lane: Satellite Quorum</div>
            <div style="margin-bottom: 15px; font-size: 12px; color: #00ffcc;">
              ${witness.aligned_count}/${witness.witness_count} satellites aligned · Avg alignment: ${(witness.avg_alignment * 100).toFixed(1)}%
            </div>
            <div class="witness-list">
              ${witnessHTML}
            </div>
          </div>

          <!-- FOOTER -->
          <div style="text-align: center; margin-top: 40px; font-size: 11px; color: #666;">
            📍 ${truth.region} · Epoch: ${new Date(truth.epoch_start).toLocaleString()} · Updated: ${new Date(truth.timestamp).toLocaleTimeString()}
          </div>
        `;
      } catch (err) {
        document.getElementById('content').innerHTML = `
          <div class="loading" style="color: #ff6b6b;">
            ❌ Error: ${err.message}
          </div>
        `;
      }
    }

    fetchAndRender();
    setInterval(fetchAndRender, POLL_MS);
  </script>
</body>
</html>
