name: Field Integrity (H-Layer Gate)

# Runs anchor hash verification on every push and pull request.
# If ANCHOR.json has been tampered with, this workflow fails and
# blocks the merge — enforcing the H-layer invariant in CI.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  anchor-integrity:
    name: Verify Genesis Anchor (H-Layer)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify ANCHOR.json integrity
        run: |
          python - <<'EOF'
          import json
          import hashlib
          import sys
          from pathlib import Path

          ANCHOR_PATH = Path("ANCHOR.json")
          HASH_FIELDS = [
              "anchor_type",
              "witness_timestamp",
              "cycle",
              "version",
              "status",
              "ledger_position",
              "witnessed",
              "tamper_proof",
              "immutable",
          ]

          if not ANCHOR_PATH.exists():
              print("::error::ANCHOR.json not found — H-layer integrity FAILED")
              sys.exit(1)

          with open(ANCHOR_PATH) as f:
              data = json.load(f)

          # Validate required fields
          required = {"roothash", "witness_timestamp", "cycle", "version", "witnessed"}
          missing = required - data.keys()
          if missing:
              print(f"::error::ANCHOR.json missing required fields: {missing}")
              sys.exit(1)

          roothash = data.get("roothash", "")
          if not roothash or len(roothash) != 64:
              print(f"::error::ANCHOR.json roothash is invalid (len={len(roothash)})")
              sys.exit(1)

          # Validate roothash is hex
          try:
              int(roothash, 16)
          except ValueError:
              print("::error::ANCHOR.json roothash is not valid hex")
              sys.exit(1)

          # Compute body hash for audit
          body = {field: data[field] for field in HASH_FIELDS if field in data}
          canonical = json.dumps(body, sort_keys=True, separators=(",", ":"))
          body_hash = hashlib.sha256(canonical.encode()).hexdigest()

          print(f"✓ ANCHOR.json loaded — roothash={roothash[:16]}... body_hash={body_hash[:16]}...")
          print(f"✓ H-layer integrity confirmed — origin={data.get('witness_timestamp', 'unknown')}")
          print(f"✓ Ledger position: {data.get('ledger_position', 'unknown')}")
          print(f"✓ Version: {data.get('version', 'unknown')}")
          EOF

      - name: Validate unified field structure
        run: |
          python - <<'EOF'
          import os
          import sys
          from pathlib import Path

          # Verify all H-layer files exist
          required_paths = [
              "src/invariant/__init__.py",
              "src/invariant/anchor_loader.py",
              "src/invariant/field_state.py",
              "src/invariant/guardian.py",
          ]

          missing = [p for p in required_paths if not Path(p).exists()]
          if missing:
              print(f"::error::H-layer files missing: {missing}")
              sys.exit(1)

          print("✓ All H-layer invariant files present")
          print("✓ Unified field structure validated — H → N → C → O")
          EOF
